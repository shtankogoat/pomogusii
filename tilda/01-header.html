<!-- ПОМОГУСИИ · ШАПКА (меню). Пункты меню — ссылки на разделы страницы (#program, #faq и т.д.). -->
<header class="pg pg-header">
  <div class="pg-wrap">
    <a class="pg-logo" href="#top">
      <span class="pg-logo__name pg-gold">ПОМОГУСИИ</span>
      <span class="pg-logo__sub">Клуб по нейросетям<br>от Льва Кудрина</span>
    </a>

    <input type="checkbox" id="pg-burger" class="pg-burger-toggle">
    <label for="pg-burger" class="pg-burger" aria-label="Меню">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </label>

    <nav class="pg-nav">
      <a href="#about">О клубе</a>
      <a href="#program">Программа</a>
      <a href="#results">Результаты</a>
      <a href="#tariff">Тариф</a>
      <a href="#faq">FAQ</a>
      <a href="#contacts">Контакты</a>
    </nav>

    <a class="pg-btn pg-btn--ghost pg-btn--sm" href="#popup:tarif1">Вступить в клуб
      <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></i>
    </a>
  </div>
</header>
<div class="pg-header-space"></div>
<script>
  // закрывает мобильное меню после нажатия на пункт
  document.querySelectorAll('.pg-nav a').forEach(function (a) {
    a.addEventListener('click', function () { document.getElementById('pg-burger').checked = false; });
  });
</script>
